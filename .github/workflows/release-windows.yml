name: release-windows

# 只产出 Windows/amd64 一个包 —— 这是 dsh-cpa-switch 插件唯一会下载的产物。
#
# 上游（router-for-me/CLIProxyAPI）的 release.yaml 有 717 行、覆盖 5 个平台
# （darwin/windows/linux-glibc/linux-musl/freebsd 各含 arm64）。本 fork 是
# 个人自用 + 给插件当下载源，**只需要 Windows amd64**，照抄上游是纯负担：
# 多出来的平台每次发版都要跑、要失败重试，而我们一个字节都用不上。
#
# 触发方式：**在 GitHub 网页上点「Run workflow」，填一个版本号**。
#
# ⚠️ 刻意**不监听 tag 推送**，原因是一个真实的冲突：
#
#   上游的 `release.yaml` 在 `on.push.tags` 里写的是 `'*'`（所有 tag），
#   而它**也构建 windows-amd64**。只要推任何 tag，两个工作流会同时跑，
#   并且**都往同一个 Release 传同名文件**（`CLIProxyAPI_<版本>_windows_amd64.zip`）
#   —— 谁后传谁赢，用户下载到的 exe 是哪一个不确定。
#   它还会顺带跑 10 个目标、5 个平台（含 FreeBSD sysroot、manylinux 容器），
#   在本 fork 里全是没有消费者的浪费。
#
# 用 `workflow_dispatch` 触发则完全不碰上游那条路径：
# 不需要本地 git、不需要代理、也不会和上游抢文件。
#
# 产物名与上游保持**同名格式**，这样插件的 `assetPattern`
# （`/^CLIProxyAPI_[\d.]+_windows_amd64\.zip$/u`）不用改就能匹配。

on:
  workflow_dispatch:
    inputs:
      version:
        description: '版本号，只能数字和点（如 8.0.12）。它会进产物文件名。'
        required: true
        type: string

permissions:
  contents: write

env:
  # 跟上游 release.yaml 对齐；go.mod 要求 1.26.0。
  GO_VERSION: '1.26.4'

jobs:
  build-windows-amd64:
    name: build windows-amd64
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          # ⚠️ **depth 1 就够**（2026-10-12 改，原来是 0）。
          #
          # 原来写 0 的理由是「版本号取自 tag，且 `--generate-notes` 要遍历历史」——
          # 两条现在都不成立：版本号来自手动输入、正文是我们自己拼的（不用
          # `--generate-notes`）。而真正需要的历史（上游那个 tag 的提交）由下一步
          # 自己 `git fetch --depth 1` 拉。
          #
          # 实测过：depth 1 克隆 + depth 1 拉 tag，`git diff <fork> HEAD` 与
          # `git checkout --detach <上游提交>` 都正常（两个提交的对象都在本地）。
          # 而 depth 0 每次要克隆上游**全部**历史，纯慢。
          fetch-depth: 1

      # 版本号先校验、再解析成上游的**确切提交**，并把源码切到那个提交 ——
      # 这一步在 setup-go / 测试 / 构建**之前**，所以后面所有步骤编译的都是
      # 我们声明的那一份源码，而不是「fork 当前碰巧是什么」。
      #
      # ⚠️ **为什么必须钉**：原来 `inputs.version` 只进产物名与 ldflags，
      # 编译的是 fork 的 HEAD —— **没有任何东西证明 exe 对应上游该 tag 的源码**。
      # fork 的 HEAD 只要有人推一次（改文档、同步上游），下次发版出来的 exe
      # 就换了源码，而版本号、产物名、Release 正文**全都看不出来**。
      # 实测过一次「恰好干净」（v8.0.13-lp 与上游 v8.0.13 的源码树只差本文件），
      # 但那是巧合，不是机制。
      #
      # ⚠️ 用 `FETCH_HEAD^{commit}` 而不是 `FETCH_HEAD`：上游的 tag 现在都是轻量的，
      # 但**哪天变成附注 tag**，`FETCH_HEAD` 解析出来的是 tag 对象而不是提交，
      # `git checkout` 会落在 tag 对象上 —— 那时 `git rev-parse HEAD` 与
      # 我们记进 Release 正文的 SHA 不一致，而**没有任何报错**。
      # `^{commit}` 对两种 tag 都给出提交。
      #
      # ⚠️ `.github/` **从 fork 取回**：这一步之后工作区里是上游的源码，
      # 但下面几步（刷模型目录的脚本、以及本 workflow 自己）用的是 fork 这边
      # 的 `.github/`。不取回的话脚本会跟着切走上游版本（上游确实也有同名脚本，
      # 但那是**上游的版本**）—— 我们要的是「上游源码 + 本 fork 的发布脚手架」。
      - name: Pin upstream source
        shell: bash
        run: |
          set -euo pipefail
          upstream_repo="https://github.com/router-for-me/CLIProxyAPI.git"

          # 版本号来自手动触发的输入，不再从 tag 推导（见文件头的原因）。
          raw="${{ inputs.version }}"

          # ⚠️ 产物名里的版本号**只能有数字和点**。
          #
          # 插件的 assetPattern 是 `^CLIProxyAPI_[\d.]+_windows_amd64\.zip$`，
          # 它**不认**字母或连字符。若版本号写成 `8.0.12-lp`，产物名会是
          # `CLIProxyAPI_8.0.12-lp_windows_amd64.zip`，正则匹配不上
          # → 插件报「release 里没有匹配的文件」→ 用户卡在下载。
          # 而这条报错**完全指不到真正原因**（其实是版本号写错了）。
          #
          # 所以在这里就挡住，并直接告诉用户该怎么改 —— 而不是等构建
          # 跑完、发出去、用户装插件时才失败。
          if ! printf '%s' "$raw" | grep -qE '^[0-9]+(\.[0-9]+)*$'; then
            echo "::error::版本号 \"$raw\" 不合法：只能由数字和点组成（如 8.0.7.1）。"
            echo "插件的 assetPattern 只接受 [0-9.]，带字母或连字符会让它找不到产物。" >&2
            exit 1
          fi
          version="$raw"
          upstream_tag="v${version}"

          # Release 的 tag 用 `-lp` 后缀，跟上游区分开。
          # 上游 tag 是三段（v8.0.7 / v8.0.12），我们加第四段式的后缀，
          # 这样 `git fetch upstream --tags` 时不会撞名（撞名会让 tag 歧义）。
          release_tag="v${version}-lp"

          # ⚠️ **tag 不存在就必须当场失败**，而且要说清是哪个 tag：
          # 静默退回「编 fork 的 HEAD」正是这一步要消灭的行为。
          if ! git ls-remote --exit-code "$upstream_repo" "refs/tags/${upstream_tag}" >/dev/null 2>&1; then
            echo "::error::上游没有 tag ${upstream_tag}（${upstream_repo}）。"
            echo "版本号要填上游**已发布**的版本，且不带 v 前缀（如 8.0.13）。" >&2
            exit 1
          fi

          git fetch --depth 1 "$upstream_repo" "refs/tags/${upstream_tag}"
          upstream_sha="$(git rev-parse 'FETCH_HEAD^{commit}')"

          fork_sha="$(git rev-parse HEAD)"
          git checkout --detach "$upstream_sha"
          # 把 fork 的发布脚手架放回来（源码归上游、脚手架归 fork）。
          #
          # ⚠️ 先 `rm -rf`：**`git checkout <提交> -- <路径>` 不会删掉别的文件** ——
          # 上游哪天新增一个 fork 没有的 workflow，它会**留在工作区里**，
          # 于是「工作区 = 上游源码 + fork 的 .github/」这句话就不成立了。
          # 今天两边的 `.github/` 只差我们这一个 workflow，看不出问题；明天就不一定。
          rm -rf .github
          git checkout "$fork_sha" -- .github/

          # ⚠️ **自证**：checkout 之后 HEAD 必须就是我们记下来的那个 SHA。
          # 少了这一步，`^{commit}` 写错、tag 变成附注 tag 这类问题
          # 会以「Release 正文里的 SHA 与真实源码不符」的形式**静默**留下。
          actual="$(git rev-parse HEAD)"
          if [ "$actual" != "$upstream_sha" ]; then
            echo "::error::checkout 后 HEAD=${actual}，与解析出的 ${upstream_sha} 不符。"
            exit 1
          fi

          # 除 `.github/` 外与 fork 的差异 —— 只记录，不失败。
          #
          # 为什么只记录：fork 将来可能有意带源码补丁。但「有意」与「碰巧」的区别
          # 必须**看得见**，所以把差异条数与文件名前缀写进 Release 正文。
          source_diff="$(git diff --name-only "$fork_sha" HEAD -- . ':!.github' | wc -l | tr -d ' ')"
          build_date="$(date -u +%Y-%m-%dT%H:%M:%SZ)"

          {
            echo "RELEASE_VERSION=$version"
            echo "RELEASE_TAG=$release_tag"
            echo "UPSTREAM_TAG=$upstream_tag"
            echo "UPSTREAM_SHA=$upstream_sha"
            echo "FORK_SHA=$fork_sha"
            echo "SOURCE_DIFF_COUNT=$source_diff"
            # 兼容旧字段：产物里 `main.Commit` 一直打的是短 SHA，
            # 换成上游的短 SHA 才是「这份产物对应哪份源码」的正确答案。
            echo "COMMIT=$(printf '%s' "$upstream_sha" | cut -c1-7)"
            echo "BUILD_DATE=$build_date"
          } >> "$GITHUB_ENV"

          echo "上游源码：${upstream_tag} @ ${upstream_sha}"
          echo "fork 脚手架：${fork_sha}（.github/，不进二进制）"
          echo "除 .github/ 外的源码差异：${source_diff} 个文件"

      - uses: actions/setup-go@v6
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      # 上游在构建前刷一次模型目录，不跑的话产物里的模型清单是旧的。
      #
      # ⚠️ 允许失败：这个脚本要从另一个仓库（router-for-me/models）
      # `git fetch` 一次远程数据。网络抖一下就会让整个发版挂掉，
      # 而它**只是刷新清单**——失败时产物回退到仓库里内嵌的版本，
      # 仍然是个能跑的 exe。用一个可选的"新鲜度"换发版的确定性，值。
      - name: Refresh models catalog
        shell: bash
        continue-on-error: true
        run: bash .github/scripts/refresh-model-catalogs.sh

      # 先跑测试再打包 —— 发出去的 exe 是用户唯一的运行体，
      # 构建脚本自带一道门禁比事后排查便宜。
      #
      # ⚠️ **不许整条放行**（2026-10-12 改，原来带 `continue-on-error: true`）。
      #
      # 原来那个写法的问题是**范围**：它放行的是「任何一个用例失败」，
      # 于是上游某次改动真的弄坏了什么，发版**照样过**，日志里只有一句被忽略的红
      # —— 用户拿到一个测试不过的 exe，谁也看不见。
      #
      # 现在只放行**那一个**已知的并发偶发失败
      # （`internal/api/handlers/management` 的
      # `TestDeletePluginRemovesDiscoveredFileAndConfig`，单跑 3/3 通过）：
      # 用 `-skip` 把它排除在**必须通过**的集合之外，其余任何失败都阻断发版。
      # `-skip` 是 Go 1.20 加给 `go test` 的（[发布说明](https://go.dev/doc/go1.20)），
      # 本仓用的是 1.26.x。
      #
      # ⚠️ 跳过的用例**要在日志里留痕**（`::warning::` 会进 Actions 摘要），
      # 否则「跑过了」与「跳过了」在日志里长一个样。
      #
      # ⚠️ 这条豁免是**有期限**的：它属于上游的 flaky，能上报就上报；
      # 上游修掉之后这个 `-skip` 必须删（否则它会把那条用例**永久**挡在门外）。
      # 记录见 dsh-cpa-switch 的 `docs/PLAN.md` §2.4。
      - name: Test
        shell: bash
        run: |
          set -euo pipefail
          # 只跳过这一条；其余失败（含编译失败）都会让这一步非 0 → 阻断发版。
          skipped='^(TestDeletePluginRemovesDiscoveredFileAndConfig)$'
          echo "::warning::跳过已知 flaky 用例 ${skipped}（其余失败会阻断发版）"
          go test ./... -count=1 -skip "$skipped"

      - name: Build
        shell: bash
        env:
          CGO_ENABLED: '1'
        run: |
          set -euo pipefail
          # 版本号 / 上游 SHA / 构建时刻都已在「Pin upstream source」里算好并写进 env
          # （校验也都在那边：非法版本号、上游没有该 tag 都**不会**走到这里）。
          #
          # ⚠️ 这里**不再自己解析 `inputs.version`**：解析与校验只留一处，
          # 两处各写一遍就会出现「这一步放行、那一步拦住」的分叉。
          #
          # ⚠️ 源码此刻**已经是上游那个提交**（上一步 checkout 的），不是 fork 的 HEAD。
          mkdir -p archive
          # CGO_ENABLED=1 是**必须**的：动态库渠道插件（plugins/*.dll）
          # 只有 CGO 构建才加载得起来。上游 Release 同样是这么编的。
          go build -buildvcs=false \
            -ldflags="-s -w -X main.Version=${RELEASE_VERSION} -X main.Commit=${COMMIT} -X main.BuildDate=${BUILD_DATE}" \
            -o archive/cli-proxy-api.exe ./cmd/server/

      # 冒烟：产物必须真的能跑起来，而不是"编译成功"就算。
      # `--help` 走完整的 flag 注册路径，能把链接期/初始化期的崩溃暴露出来。
      - name: Smoke test
        shell: bash
        run: |
          set -euo pipefail
          ./archive/cli-proxy-api.exe --help > smoke.log 2>&1 || {
            echo "exe --help 失败，产物不可用：" >&2
            cat smoke.log >&2
            exit 1
          }
          if ! grep -qi 'config' smoke.log; then
            echo "--help 输出里没有预期内容，产物可疑：" >&2
            cat smoke.log >&2
            exit 1
          fi
          echo "冒烟通过"
          head -n 20 smoke.log

      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          cp LICENSE README.md README_CN.md config.example.yaml archive/
          archive_name="CLIProxyAPI_${RELEASE_VERSION}_windows_amd64.zip"
          powershell -NoProfile -Command \
            "Compress-Archive -Path 'archive/*' -DestinationPath '${archive_name}' -Force"
          echo "ARCHIVE_NAME=$archive_name" >> "$GITHUB_ENV"
          ls -lh "$archive_name"

      # 插件解压后靠 sha256 校验，所以 checksums.txt 得有。
      # 但插件实际走的是 GitHub API 的 asset `digest` 字段，
      # 这里主要是给人手工核对用。
      - name: Checksums
        shell: bash
        run: |
          set -euo pipefail
          sha256sum "$ARCHIVE_NAME" > checksums.txt
          cat checksums.txt

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            CLIProxyAPI_*_windows_amd64.zip
            checksums.txt
          if-no-files-found: error

      # 手动触发时一律建 Release —— 这是给插件当下载源的，必须发出去。
      - name: Publish release
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            # 同版本重发：覆盖文件，不新建 Release。
            gh release upload "$RELEASE_TAG" "$ARCHIVE_NAME" checksums.txt --clobber
          else
            # `--target "$GITHUB_SHA"` 让 tag 指向**跑这次构建的那个 fork 提交**
            # （本 workflow 就在那里）。不加的话 `gh release create` 会把 tag
            # 打在默认分支的 HEAD 上，而默认分支可能已经前进了。
            #
            # ⚠️ **tag 指 fork 提交、而二进制来自上游提交** —— 两者不是一回事，
            # 所以正文里两个 SHA 都写出来（见下）。指向上游 SHA 是不行的：
            # 那是**上游仓库的**提交，本 fork 的对象库里未必有，打 tag 会失败。
            #
            # ⚠️ 正文在 shell 里拼、不经 YAML 标量：`--notes` 后面写跨行的双引号标量
            # 会被 YAML **折叠成一行**（换行变空格），别人读到的就是糊成一团的长句。
            notes="$(printf '%s\n\n%s\n\n%s\n\n%s' \
              "Windows/amd64 build for the dsh-cpa-switch plugin's download source; asset name follows the upstream convention so the plugin's assetPattern matches ($ARCHIVE_NAME)." \
              "Source of truth: upstream ${UPSTREAM_TAG} at ${UPSTREAM_SHA} — that commit was checked out before building, and it is what main.Commit inside the binary reports. CI scaffolding came from this fork at ${GITHUB_SHA} and does not affect the binary. Files differing between the two trees outside .github/: ${SOURCE_DIFF_COUNT}." \
              "Fork commit this workflow ran on: ${FORK_SHA:0:7}." \
              "Built at ${BUILD_DATE}.")"

            gh release create "$RELEASE_TAG" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TAG" \
              --notes "$notes" \
              "$ARCHIVE_NAME" checksums.txt
          fi
          echo "已发布：$RELEASE_TAG / $ARCHIVE_NAME"
          echo "  上游源码：${UPSTREAM_TAG} @ ${UPSTREAM_SHA}（除 .github/ 外差异 ${SOURCE_DIFF_COUNT} 个文件）"
